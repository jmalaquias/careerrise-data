name: Atualizar Plantéis Automaticamente

on:
  # Permite correr manualmente quando clicares num botão no GitHub
  workflow_dispatch:
  
  # Corre automaticamente todas as sextas-feiras às 20:00 (hora das atualizações da EA)
  schedule:
    - cron: '0 20 * * 5'

jobs:
  update-squads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verificar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Script Extrator de Plantéis
        run: python update_squads.py

      - name: Guardar e Fazer Commit Automático
        run: |
          git config --global user.name "CareerRise Bot"
          git config --global user.email "bot@careerrise.com"
          git add squads.json version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Atualização automática de plantéis [skip ci]" && git push)
