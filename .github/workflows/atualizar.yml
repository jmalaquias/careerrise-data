name: Atualizar Plantéis Automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 5'

jobs:
  update-squads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Script Extrator de Plantéis
        run: python update_squads.py

      - name: Gravar e Fazer Push dos Dados
        run: |
          git config --global user.name "CareerRise Bot"
          git config --global user.email "bot@careerrise.com"
          git add squads.json version.json
          if git diff --staged --quiet; then
            echo "Sem alterações para gravar."
          else
            git commit -m "🤖 Base de dados atualizada com sucesso [skip ci]"
            git push
          fi
